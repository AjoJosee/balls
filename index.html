<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Bouncing balls</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <h1>bouncing balls</h1>
    <canvas></canvas>

    <div style="color: white;" class="controls">
      <label>Balls: <input type="range" id="ballCount" min="10" max="100" step="5" value="30"></label>
      <label>Size: <input type="range" id="ballSize" min="5" max="30" step="1" value="15"></label>
      <label>Speed: <input type="range" id="ballSpeed" min="1" max="15" step="0.5" value="7"></label>
    </div>

    <script src="script.js"></script>
  </body>
</html>
